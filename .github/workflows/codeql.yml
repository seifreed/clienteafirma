---
name: CodeQL

# Static analysis (SAST) for Java. Runs on every PR and push to master, plus
# a weekly scheduled scan to catch new query rules without a code change.

"on":
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ['java']

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: codeql-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            codeql-maven-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: manual

      # Only compile; tests and dep-check are validated by build.yml.
      - name: Compile (manual build)
        run: >
          mvn -B -ntp -Denv=install
          -DskipTests
          -Ddependency-check.skip=true
          -Dcyclonedx.skip=true
          clean compile

      - name: Perform CodeQL analysis
        uses: >-
          github/codeql-action/analyze@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        with:
          category: '/language:${{ matrix.language }}'
