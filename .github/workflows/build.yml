---
name: Build

# PR gate. Compiles the env-install profile, runs tests on Linux,
# generates CycloneDX SBOMs and OWASP dependency-check reports, and
# uploads everything as artifacts. The dep-check SARIF feeds the
# Security tab via codeql-action/upload-sarif.

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile target is JDK 21 (M3.1, 2026-05-07). The pom.xml uses
  # <release>21</release>, so toolchain and bytecode are pinned to 21.

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (compile + SBOM, no tests)
        shell: bash
        run: >
          mvn -B -ntp -Denv=install -DskipTests
          -Ddependency-check.skip=true
          clean verify

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ matrix.os }}
          path: |
            target/bom.xml
            target/bom.json
            **/target/bom.xml
            **/target/bom.json
          if-no-files-found: warn

  # Tests run only on Linux: they are JVM-pure and the matrix above already
  # validates per-OS native paths (configurator, certutil invocations, etc.).
  tests:
    name: Tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ubuntu-24.04-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-24.04-maven-

      - name: Run tests
        run: mvn -B -ntp -Denv=install -Ddependency-check.skip=true test

  security:
    name: Security gate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ubuntu-24.04-security-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-24.04-security-maven-
            ubuntu-24.04-maven-

      - name: Compute weekly NVD cache key
        id: nvdkey
        shell: bash
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ubuntu-24.04-depcheck-${{ steps.nvdkey.outputs.value }}
          restore-keys: |
            ubuntu-24.04-depcheck-

      - name: Run dependency-check
        if: env.NVD_API_KEY != ''
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: >
          mvn -B -ntp -Denv=install -Psecurity-gate -DskipTests
          -DnvdApiKey="$NVD_API_KEY"
          verify

      - name: Skip dependency-check without NVD API key
        if: env.NVD_API_KEY == ''
        shell: bash
        run: >
          echo "::warning title=Dependency-Check skipped::NVD_API_KEY secret
          is not configured; skipping OWASP dependency-check to avoid
          unauthenticated NVD rate limits."

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-check-ubuntu-24.04
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.sarif
          if-no-files-found: warn

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: >-
          github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

  quality:
    name: Quality gate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ubuntu-24.04-quality-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-24.04-quality-maven-
            ubuntu-24.04-maven-

      - name: Run quality gate
        run: >
          mvn -B -ntp -Denv=install -Pquality-gate
          -DskipTests -Ddependency-check.skip=true
          verify
